<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToN英単語クイズ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #ff4d4d;
            margin-top: 0;
            font-size: 1.5em;
        }
        .progress {
            text-align: right;
            font-size: 0.9em;
            color: #aaaaaa;
            margin-bottom: 15px;
        }
        .question {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 12px 15px;
            font-size: 0.95em;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover:not(:disabled) {
            background-color: #3a3a3a;
        }
        .btn:disabled {
            cursor: not-allowed;
        }
        .btn.correct {
            background-color: #2e7d32 !important;
            border-color: #4caf50;
        }
        .btn.wrong {
            background-color: #c62828 !important;
            border-color: #ef5350;
        }
        .feedback {
            margin-top: 25px;
            padding: 15px;
            background-color: #252525;
            border-left: 4px solid #ff4d4d;
            border-radius: 0 4px 4px 0;
        }
        .feedback.is-correct {
            border-left-color: #4caf50;
        }
        .feedback-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .explanations {
            font-size: 0.9em;
            line-height: 1.6;
        }
        .explanations ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        .next-container {
            margin-top: 20px;
            text-align: right;
        }
        .btn-next {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 1em;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-next:hover {
            background-color: #ff3333;
        }
        .result-view {
            text-align: center;
        }
        .result-score {
            font-size: 2em;
            font-weight: bold;
            margin: 15px 0;
            color: #ff4d4d;
        }
        
        /* タブとテーブルのスタイル */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 15px 0;
        }
        .tab-btn {
            background-color: #2a2a2a;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .tab-btn.active {
            background-color: #ff4d4d;
            color: #fff;
            border-color: #ff4d4d;
        }
        .table-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 25px;
            border: 1px solid #333;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
            text-align: left;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #ff4d4d;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #1a1a1a;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.8em;
            display: inline-block;
        }
        .badge.correct {
            background-color: #2e7d32;
            color: #fff;
        }
        .badge.wrong {
            background-color: #c62828;
            color: #fff;
        }
        .empty-message {
            padding: 20px;
            text-align: center;
            color: #888;
        }
        .hide {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ToN English Quiz</h1>
    
    <div id="quiz-view">
        <div class="progress" id="progress-text">0 / 10</div>
        <div class="question" id="question-text"></div>
        <div class="choices" id="choices-container"></div>
        
        <div class="feedback hide" id="feedback-area">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="explanations" id="explanations-text"></div>
            <div class="next-container">
                <button class="btn-next" id="btn-next">次へ</button>
            </div>
        </div>
    </div>

    <div id="result-view" class="result-view hide">
        <h2>結果発表</h2>
        <div class="result-score" id="result-score"></div>
        <p id="pool-info"></p>
        
        <div class="tabs">
            <button class="tab-btn active" id="tab-all-btn">過去の問題一覧</button>
            <button class="tab-btn" id="tab-wrong-btn">不正解の問題一覧</button>
        </div>
        
        <div class="table-container">
            <table id="result-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">判定</th>
                        <th style="width: 50%;">問題内容</th>
                        <th style="width: 35%;">正解の意味</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <button class="btn-next" id="btn-restart" style="float: none;">次の10問を解く</button>
    </div>
</div>

<script>
const rawQuizData = [
    { id: 1, q: "Classicラウンドの「Classic」の意味は？", c: ["古典的な、定番の", "交互の、代わりの", "解き放たれた、制限のない", "昔の、古き良き"], a: 1, exp: ["Classicは「古典的な」「定番の」という意味です。", "「Alternate」の意味です。", "「Unbound」の意味です。", "「Olden」の意味です。"] },
    { id: 2, q: "Alternateラウンドの「Alternate」の意味は？", c: ["交互の、代わりの", "古典的な、定番の", "ひびの入った、狂った", "罰せられた"], a: 1, exp: ["Alternateは通常とは異なるテラーが出る「交互の」「代わりの」という意味です。", "「Classic」の意味です。", "「Cracked」の意味です。", "「Punished」の意味です。"] },
    { id: 3, q: "Punishedラウンドの「Punished」の意味は？", c: ["罰せられた", "解き放たれた、制限のない", "落ち着きがない、休まらない", "飢え苦しんだ、非常に腹が減った"], a: 1, exp: ["Punish（罰する）の過去分詞で「罰せられた」です。", "「Unbound」の意味です。", "「Restless」の意味です。", "「Starved」の意味です。"] },
    { id: 4, q: "Crackedラウンドの「Cracked」の意味は？", c: ["ひびの入った、狂った", "古典的な、定番の", "青白い、淡い", "断片化した、バラバラになった"], a: 1, exp: ["Crackedは「ひびの入った」「狂った」を意味します。", "「Classic」の意味です。", "「Pale」の意味です。", "「Fragmented」の意味です。"] },
    { id: 5, q: "Unboundラウンドの「Unbound」の意味は？", c: ["解き放たれた、制限のない", "罰せられた", "名無しの、匿名の", "顔のない、個性のない"], a: 1, exp: ["bound（縛られた）の否定で「解き放たれた」です。", "「Punished」の意味です。", "「Nameless」の意味です。", "「Faceless」の意味です。"] },
    { id: 6, q: "Mystic Moonの「Mystic」の意味は？", c: ["神秘的な", "悪意のある", "好奇心旺盛な、奇妙な", "致命的な、死に至る"], a: 1, exp: ["Mysticは「神秘的な」という意味です。", "「Malicious」の意味です。", "「Curious」の意味です。", "「Lethal」の意味です。"] },
    { id: 7, q: "Twilightラウンドの「Twilight」の意味は？", c: ["黄昏、薄明かり", "至（夏至・冬至）", "世界の終末、黙示録", "夜"], a: 1, exp: ["Twilightは「黄昏」「薄明かり」を意味します。", "「Solstice」の意味です。", "「Apocalypse」の意味です。", "「Night」の意味です。"] },
    { id: 8, q: "Solsticeラウンドの「Solstice」の意味は？", c: ["至（夏至・冬至）", "黄昏、薄明かり", "世界の終末、黙示録", "起源、生まれ、原点"], a: 1, exp: ["Solsticeは夏至や冬至の「至（し）」を指します。", "「Twilight」の意味です。", "「Apocalypse」の意味です。", "「Origin」の意味です。"] },
    { id: 9, q: "An Arbiter（テラー）の「Arbiter」の意味は？", c: ["仲裁者、裁定者", "守護者、保護者", "追跡者", "法を執行する者、強制する者"], a: 1, exp: ["Arbiterは「仲裁者」「裁定者」を意味します。", "「Guardian」の意味です。", "「Pursuer」の意味です。", "「Enforcer」の意味です。"] },
    { id: 10, q: "Apocrean Harvesterの「Harvester」の意味は？", c: ["収穫者、刈り取り機", "ゴミ漁り、廃品回収者", "画家、ペンキ職人", "航海士、操縦士、案内役"], a: 1, exp: ["Harvest（収穫）する人から「収穫者」を意味します。", "「Scavenger」の意味です。", "「Painter」の意味です。", "「Navigator」の意味です。"] },
    { id: 11, q: "Arrival（テラー）の「Arrival」の意味は？", c: ["到着、出現", "脱出", "発表、アナウンス、告知", "侵入、侵害、違反"], a: 1, exp: ["Arriveの名詞形で「到着」「出現」です。", "「Escape」の意味です。", "「Announcement」の意味です。", "「Infringement」の意味です。"] },
    { id: 12, q: "Bacteria（テラー）の「Bacteria」の意味は？", c: ["バクテリア、細菌", "ウイルス", "大群", "肉"], a: 1, exp: ["Bacteriaは「細菌」「バクテリア」です。", "「Virus」の意味です。", "「Swarm」の意味です。", "「Meat」の意味です。"] },
    { id: 13, q: "Bad Batterの「Batter」の意味は？", c: ["打者、バッター", "道化師", "詐欺師、偽物、騙り手", "囚人、捕虜"], a: 1, exp: ["野球などの「打者（バッター）」を意味します。", "「Jester」の意味です。", "「Imposter」の意味です。", "「Prisoner」の意味です。"] },
    { id: 14, q: "Corrupted Toysの「Corrupted」の意味は？", c: ["堕落した、壊れた、データが破損した", "ひびの入った、狂った", "断片化した、バラバラになった", "腐敗した、朽ちた"], a: 1, exp: ["Corruptは「堕落した」「データ破損した」です。", "「Cracked」の意味です。", "「Fragmented」の意味です。", "「Decayed」の意味です。"] },
    { id: 15, q: "Cubor's Revengeの「Revenge」の意味は？", c: ["復讐、復讐する", "案内、指導", "裁判、判決、審判", "観察、監視、目撃"], a: 1, exp: ["Revengeは「復讐」を意味します。", "「Guidance」の意味です。", "「Judgement」の意味です。", "「Observation」の意味です。"] },
    { id: 16, q: "Deleted（テラー）の「Deleted」の意味は？", c: ["削除された", "罰せられた", "破壊された", "存在する"], a: 1, exp: ["Deleteの過去分詞で「削除された」です。", "「Punished」の意味です。", "「Destroyed」の意味です。", "「Exist」の対義です。"] },
    { id: 17, q: "Demented Spongebobの「Demented」の意味は？", c: ["認知症の、発狂した", "悪意のある", "好奇心旺盛な、奇妙な", "怒った"], a: 1, exp: ["Dementedは理性を失った「発狂した」です。", "「Malicious」の意味です。", "「Curious」の意味です。", "「Angry」の意味です。"] },
    { id: 18, q: "Dog Mimicの「Mimic」の意味は？", c: ["擬態する、真似る", "追跡する", "探す、追い求める", "破壊する"], a: 1, exp: ["Mimicは「擬態する」「真似る」です。", "「Pursue」の意味です。", "「Seek」の意味です。", "「Destroy」の意味です。"] },
    { id: 19, q: "DoomBoxの「Doom」の意味は？", c: ["破滅、運命", "恐怖、恐ろしいもの", "世界の終末、黙示録", "精神病、精神異常"], a: 1, exp: ["Doomは避けられない「破滅」「凶運」です。", "「Terror」の意味です。", "「Apocalypse」の意味です。", "「Psychosis」の意味です。"] },
    { id: 20, q: "Express Train To Hellの「Express」の意味は？", c: ["急行の、表現する", "致命的な、死に至る", "致命的な、死を招く", "突進する、急ぐ"], a: 1, exp: ["列車などの「急行」や「表現する」です。", "「Lethal」の意味です。", "「Fatal」の意味です。", "「Rush」の意味です。"] },
    { id: 21, q: "Harvest（マップ）の「Harvest」の意味は？", c: ["収穫", "実験（すること）", "開発、発展", "孤立、隔離"], a: 1, exp: ["Harvestは作物の「収穫」を意味します。", "「Experimentation」の意味です。", "「Development」の意味です。", "「Isolation」の意味です。"] },
    { id: 22, q: "Immortal Snailの「Immortal」の意味は？", c: ["不死の、不滅の", "生きている", "名無しの、匿名の", "顔のない、個性のない"], a: 1, exp: ["Mortalの否定で「不死の」「不滅の」です。", "「Living」の意味です。", "「Nameless」の意味です。", "「Faceless」の意味です。"] },
    { id: 23, q: "Imposter（テラー）の「Imposter」の意味は？", c: ["詐欺師、偽物、騙り手", "囚人、捕虜", "有罪判決を受けた人、囚人", "宮廷道化師"], a: 1, exp: ["他人の身分を騙る「詐欺師」「偽物」です。", "「Prisoner」の意味です。", "「Convict」の意味です。", "「Jester」の意味です。"] },
    { id: 24, q: "Judgement Birdの「Judgement」の意味は？", c: ["裁判、判決、審判", "復讐、復讐する", "案内、指導", "観察、監視、目撃"], a: 1, exp: ["Judge（裁く）の名詞形で「裁判」「審判」です。", "「Revenge」の意味です。", "「Guidance」の意味です。", "「Observation」の意味です。"] },
    { id: 25, q: "Malicious Twinsの「Malicious」の意味は？", c: ["悪意のある", "好奇心旺盛な、奇妙な", "認知症の、発狂した", "怒った"], a: 1, exp: ["他人を害する「悪意のある」を意味します。", "「Curious」の意味です。", "「Demented」の意味です。", "「Angry」の意味です。"] },
    { id: 26, q: "MissingNoの「Missing」の意味は？", c: ["行方不明の、欠けている", "削除された", "名無しの、匿名の", "解き放たれた、制限のない"], a: 1, exp: ["Miss（失う）から「行方不明の」「欠落した」です。", "「Deleted」の意味です。", "「Nameless」の意味です。", "「Unbound」の意味です。"] },
    { id: 27, q: "Pale Associationの「Pale」の意味は？", c: ["青白い、淡い", "霧、もや", "夜", "黄昏、薄明かり"], a: 1, exp: ["顔色が「青白い」、色が「淡い」です。", "「Mist」の意味です。", "「Night」の意味です。", "「Twilight」の意味です。"] },
    { id: 28, q: "Prisoner（テラー）の「Prisoner」の意味は？", c: ["囚人、捕虜", "刑務所長、看守、管理人", "有罪判決を受けた人、囚人", "詐欺師、偽物、騙り手"], a: 1, exp: ["Prison（刑務所）の「囚人」「捕虜」です。", "「Warden」の意味です。", "「Convict」の意味です。", "「Imposter」の意味です。"] },
    { id: 29, q: "Red Fanaticの「Fanatic」の意味は？", c: ["狂信者、マニア", "仲裁者、裁定者", "守護者、保護者", "法を執行する者、強制する者"], a: 1, exp: ["何かに猛烈に熱狂する「狂信者」です。", "「Arbiter」の意味です。", "「Guardian」の意味です。", "「Enforcer」の意味です。"] },
    { id: 30, q: "Rush（テラー）の「Rush」の意味は？", c: ["突進する、急ぐ", "擬態する、真似る", "探す、追い求める", "触る、触れる"], a: 1, exp: ["激しく「突進する」「急ぐ」です。", "「Mimic」の意味です。", "「Seek」の意味です。", "「Touch」の意味です。"] },
    { id: 31, q: "Scavenger（テラー）の「Scavenger」の意味は？", c: ["ゴミ漁り、廃品回収者、腐肉食動物", "収穫者、刈り取り機", "画家、ペンキ職人", "航海士、操縦士、案内役"], a: 1, exp: ["廃品などを漁る「スカベンジャー」です。", "「Harvester」の意味です。", "「Painter」の意味です。", "「Navigator」の意味です。"] },
    { id: 32, q: "Seek（テラー）の「Seek」の意味は？", c: ["探す、追い求める", "擬態する、真似る", "突進する、急ぐ", "触る、触れる"], a: 1, exp: ["Hide and seek（かくれんぼ）の「探す」です。", "「Mimic」の意味です。", "「Rush」の意味です。", "「Touch」の意味です。"] },
    { id: 33, q: "Shade of Ambitionの「Ambition」の意味は？", c: ["野心、大志", "復讐、復讐する", "破滅、運命", "恐怖、恐ろしいもの"], a: 1, exp: ["大いなる望みである「野心」「大志」です。", "「Revenge」の意味です。", "「Doom」の意味です。", "「Terror」の意味です。"] },
    { id: 34, q: "Spongefly Swarmの「Swarm」の意味は？", c: ["（昆虫などの）大群", "バクテリア、細菌", "ウイルス", "肉"], a: 1, exp: ["虫などの「大群」を意味します。", "「Bacteria」の意味です。", "「Virus」の意味です。", "「Meat']の意味です。"] },
    { id: 35, q: "Starved（テラー）の「Starved」の意味は？", c: ["飢え苦しんだ、非常に腹が減った", "罰せられた", "落ち着きがない、休まらない", "生きている"], a: 1, exp: ["Starve（飢える）から「非常に腹が減った」です。", "「Punished」の意味です。", "「Restless」の意味です。", "「Living」の意味です。"] },
    { id: 36, q: "Terror of Nowhereの「Terror」の意味は？", c: ["恐怖、恐ろしいもの", "破滅、運命", "世界の終末、黙示録", "精神病、精神異常"], a: 1, exp: ["ゲーム名にもある通り「恐怖」を意味します。", "「Doom」の意味です。", "「Apocalypse」の意味です。", "「Psychosis」の意味です。"] },
    { id: 37, q: "The Guidance（テラー）の「Guidance」の意味は？", c: ["案内、指導", "裁判、判決、審判", "復讐、復讐する", "観察、監視、目撃"], a: 1, exp: ["Guideの名詞形で「案内」「指導」です。", "「Judgement」の意味です。", "「Revenge」の意味です。", "「Observation」の意味です。"] },
    { id: 38, q: "The Jester（テラー）の「The Jester」の意味は？", c: ["宮廷道化師", "詐欺師、偽物、騙り手", "囚人、捕虜", "有罪判決を受けた人、囚人"], a: 1, exp: ["王宮に仕える「道化師」を意味します。", "「Imposter」の意味です。", "「Prisoner」の意味です。", "「Convict」の意味です。"] },
    { id: 39, q: "The LifeBringerの「Bringer」の意味は？", c: ["持ってくる人、もたらすもの", "収穫者、刈り取り機", "ゴミ漁り、廃品回収者", "法を執行する者、強制する者"], a: 1, exp: ["Bring（持ってくる）に-erがつき「もたらすもの」です。", "「Harvester」の意味です。", "「Scavenger」の意味です。", "「Enforcer」の意味です。"] },
    { id: 40, q: "The Origin（テラー）の「Origin」の意味は？", c: ["起源、生まれ、原点", "至（夏至・冬至）", "黄昏、薄明かり", "世界の終末、黙示録"], a: 1, exp: ["物事の始まりである「起源」「原点」です。", "「Solstice」の意味です。", "「Twilight」の意味です。", "「Apocalypse」の意味です。"] },

    { id: 95, q: "Inner Towerの「Inner」の意味は？", c: ["内部の、内側の", "～の上方に", "脱出する、逃げる", "存在する"], a: 1, exp: ["内側にある「内部の」を意味します。", "「Above」の意味です。", "「Escape」の意味です。", "「Exist」の意味です。"] },
    { id: 96, q: "Neon Towersの「Towers」の意味は？", c: ["塔、高層ビル", "立方体", "迷宮", "土台"], a: 1, exp: ["Tower（塔）の複数形です。", "「Cube」の意味です。", "「Labyrinth」の意味です。", "「Baseplate」の意味です。"] },
    { id: 97, q: "Sea Baseの「Sea」の意味は？", c: ["海", "夜", "黄昏", "霧"], a: 1, exp: ["「海」を意味する基本単語です。", "「Night」の意味です。", "「Twilight」の意味です。", "「Mist」の意味です。"] },
    { id: 98, q: "Skyscraperの「Skyscraper」の意味は？", c: ["超高層ビル", "塔", "立方体", "迷路"], a: 1, exp: ["空を削るもの＝「超高層ビル」「摩天楼」です。", "「Tower」の意味です。", "「Cube」の意味です。", "「Maze」の意味です。"] },
    { id: 99, q: "The Wallの「Wall」の意味は？", c: ["壁", "土台", "立方体", "塔"], a: 1, exp: ["建物の「壁」を意味する基本名詞です。", "「Baseplate」の意味です。", "「Cube」の意味です。", "「Tower」の意味です。"] },
    { id: 100, q: "Throne（マップ）の「Throne」の意味は？", c: ["王座、玉座", "宮廷道化師", "詐欺師", "囚人"], a: 1, exp: ["王が座る「王座」「玉座」を意味します。", "「Jester」の意味です。", "「Imposter」の意味です。", "「Prisoner」の意味です。"] }
];

let availableIds = [];
let currentQuizSet = [];
let currentIndex = 0;
let score = 0;

// セッション内の履歴（テーブル生成用）
let sessionHistory = [];
// 現在のテーブル表示モード ('all' か 'wrong')
let currentTableMode = 'all';

const quizView = document.getElementById('quiz-view');
const resultView = document.getElementById('result-view');
const progressText = document.getElementById('progress-text');
const questionText = document.getElementById('question-text');
const choicesContainer = document.getElementById('choices-container');
const feedbackArea = document.getElementById('feedback-area');
const feedbackTitle = document.getElementById('feedback-title');
const explanationsText = document.getElementById('explanations-text');
const btnNext = document.getElementById('btn-next');
const resultScore = document.getElementById('result-score');
const poolInfo = document.getElementById('pool-info');
const btnRestart = document.getElementById('btn-restart');
const tableBody = document.getElementById('table-body');
const tabAllBtn = document.getElementById('tab-all-btn');
const tabWrongBtn = document.getElementById('tab-wrong-btn');

function initPool() {
    availableIds = rawQuizData.map(item => item.id);
}

function generateQuizSet() {
    // 100問すべて消化したらリセット（プール再構築）
    if (availableIds.length < 10) {
        initPool();
    }

    currentQuizSet = [];
    sessionHistory = []; // 新しいセッションの履歴をクリア
    
    for (let i = 0; i < 10; i++) {
        const randomIndex = Math.floor(Math.random() * availableIds.length);
        const selectedId = availableIds.splice(randomIndex, 1)[0];
        const quizItem = rawQuizData.find(item => item.id === selectedId);
        currentQuizSet.push(shuffleChoices(quizItem));
    }
    
    currentIndex = 0;
    score = 0;
}

function shuffleChoices(item) {
    const newItem = {
        id: item.id,
        q: item.q,
        c: [...item.c],
        a: item.a,
        exp: [...item.exp]
    };

    let zipped = newItem.c.map((choice, index) => {
        return { choice: choice, exp: newItem.exp[index], isCorrect: (index + 1 === newItem.a) };
    });

    for (let i = zipped.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [zipped[i], zipped[j]] = [zipped[j], zipped[i]];
    }

    newItem.c = zipped.map(z => z.choice);
    newItem.exp = zipped.map(z => z.exp);
    newItem.a = zipped.findIndex(z => z.isCorrect) + 1;

    return newItem;
}

function loadQuestion() {
    feedbackArea.classList.add('hide');
    const currentQuiz = currentQuizSet[currentIndex];
    
    progressText.textContent = `${currentIndex + 1} / 10`;
    questionText.textContent = currentQuiz.q;
    choicesContainer.innerHTML = '';

    currentQuiz.c.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'btn';
        button.textContent = choice;
        button.addEventListener('click', () => selectAnswer(index + 1));
        choicesContainer.appendChild(button);
    });
}

function selectAnswer(choiceNum) {
    const currentQuiz = currentQuizSet[currentIndex];
    const buttons = choicesContainer.getElementsByClassName('btn');

    for (let btn of buttons) {
        btn.disabled = true;
    }

    const isCorrect = (choiceNum === currentQuiz.a);
    
    // 履歴オブジェクトを作ってセッション履歴に追加
    sessionHistory.push({
        question: currentQuiz.q,
        correctAnswer: currentQuiz.c[currentQuiz.a - 1],
        isCorrect: isCorrect
    });

    if (isCorrect) {
        score++;
        buttons[choiceNum - 1].classList.add('correct');
        feedbackTitle.textContent = "〇 正解";
        feedbackArea.className = "feedback is-correct";
    } else {
        buttons[choiceNum - 1].classList.add('wrong');
        buttons[currentQuiz.a - 1].classList.add('correct');
        feedbackTitle.textContent = "× 不正解";
        feedbackArea.className = "feedback";
    }

    let html = `<ul>`;
    currentQuiz.c.forEach((choice, idx) => {
        const marker = (idx + 1 === currentQuiz.a) ? '<strong>【正解】</strong>' : '';
        html += `<li>${marker}${choice} ： ${currentQuiz.exp[idx]}</li>`;
    });
    html += `</ul>`;
    explanationsText.innerHTML = html;
    
    feedbackArea.classList.remove('hide');
}

btnNext.addEventListener('click', () => {
    currentIndex++;
    if (currentIndex < 10) {
        loadQuestion();
    } else {
        showResult();
    }
});

// 結果テーブルの描画
function renderResultTable() {
    tableBody.innerHTML = '';
    
    // モードに応じてフィルタリング
    const filteredHistory = sessionHistory.filter(item => {
        if (currentTableMode === 'wrong') return !item.isCorrect;
        return true; // 'all'
    });

    if (filteredHistory.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-message">データがありません</td></tr>`;
        return;
    }

    filteredHistory.forEach(item => {
        const tr = document.createElement('tr');
        
        const tdStatus = document.createElement('td');
        const spanBadge = document.createElement('span');
        spanBadge.className = item.isCorrect ? 'badge correct' : 'badge wrong';
        spanBadge.textContent = item.isCorrect ? '正解' : '不正解';
        tdStatus.appendChild(spanBadge);
        
        const tdQuestion = document.createElement('td');
        tdQuestion.textContent = item.question;
        
        const tdAnswer = document.createElement('td');
        tdAnswer.textContent = item.correctAnswer;
        
        tr.appendChild(tdStatus);
        tr.appendChild(tdQuestion);
        tr.appendChild(tdAnswer);
        tableBody.appendChild(tr);
    });
}

function showResult() {
    quizView.classList.add('hide');
    resultView.classList.remove('hide');
    resultScore.textContent = `${score} / 10 問正解`;
    
    // 100問すべて終わったタイミング、または残り数をわかりやすく表示
    if (availableIds.length === 0) {
        poolInfo.textContent = `全100問をすべて消化しました！次回リセットされます。`;
    } else {
        poolInfo.textContent = `残りの未出題数: ${availableIds.length} 問 / 100 問中`;
    }

    // デフォルトは「過去の問題一覧」を表示
    currentTableMode = 'all';
    tabAllBtn.classList.add('active');
    tabWrongBtn.classList.remove('active');
    
    renderResultTable();
}

// タブのイベントリスナー
tabAllBtn.addEventListener('click', () => {
    currentTableMode = 'all';
    tabAllBtn.classList.add('active');
    tabWrongBtn.classList.remove('active');
    renderResultTable();
});

tabWrongBtn.addEventListener('click', () => {
    currentTableMode = 'wrong';
    tabAllBtn.classList.remove('active');
    tabWrongBtn.classList.add('active');
    renderResultTable();
});

btnRestart.addEventListener('click', () => {
    resultView.classList.add('hide');
    quizView.classList.remove('hide');
    generateQuizSet();
    loadQuestion();
});

initPool();
generateQuizSet();
loadQuestion();
</script>

</body>
</html>
